<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제목 없는 가제본</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--kraft:#c9a27e;--kraft2:#b8906b;--thread:#7a2e22;--paper:#f6f1e7;--pencil:#45464d;--ghost:#a9a49a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#26231f radial-gradient(ellipse at 50% 30%,#3a342d,#1c1a17 70%);color:var(--pencil);font-family:"Nanum Myeongjo",serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px 16px;overflow:hidden;-webkit-user-select:none;user-select:none}
.stage{perspective:1800px;width:min(92vw,380px);aspect-ratio:3/4.3;position:relative}
.book{position:absolute;inset:0;transform-style:preserve-3d}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.2,1),filter 1s;backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer}
.leaf.turned{transform:rotateY(-178deg);pointer-events:none}
.leaf.turning{filter:brightness(.92)}
.page{position:absolute;inset:0;background:var(--paper);border-radius:2px 6px 6px 2px;box-shadow:0 18px 40px -14px rgba(0,0,0,.7),inset 24px 0 30px -24px rgba(90,60,30,.35);overflow:hidden;padding:34px 26px 30px 52px}
.page::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 33px,rgba(120,140,170,.13) 33px 34px);background-position:0 70px;pointer-events:none}
.page::after{content:"";position:absolute;left:30px;top:0;bottom:0;border-left:2px dotted rgba(122,46,34,.55)}
.no{position:absolute;bottom:14px;right:22px;font-family:"Nanum Pen Script";font-size:18px;color:var(--ghost)}
/* cover */
.cover{background:var(--kraft) repeating-linear-gradient(90deg,transparent 0 6px,rgba(80,50,20,.07) 6px 7px);padding:0}
.cover::before{display:none}
.cover::after{left:0;width:46px;border-left:0;border-right:3px solid var(--thread);background:rgba(80,50,20,.1)}
.threads{position:absolute;left:0;top:0;bottom:0;width:49px;display:flex;flex-direction:column;justify-content:space-evenly;z-index:2}
.threads i{display:block;height:3px;background:var(--thread);box-shadow:0 1px 1px rgba(0,0,0,.25)}
.blank{position:absolute;left:78px;top:34px;width:54px;height:170px;border:1px dashed rgba(90,60,30,.35);background:rgba(246,241,231,.25)}
.hint{position:absolute;right:22px;bottom:20px;font-family:"Nanum Pen Script";font-size:20px;color:#5a3d22;opacity:.8}
.back .hint{left:78px;right:auto}
/* handwriting */
.hand{font-family:"Nanum Pen Script",cursive;font-size:25px;line-height:34px;color:var(--pencil);position:relative}
.date{font-family:"Nanum Pen Script";font-size:30px;color:#2e2f35;line-height:34px;margin-bottom:0}
.small{font-size:21px;color:#6b6a68}
.erase{position:relative;color:var(--ghost);filter:blur(.5px);display:inline}
.erase::after{content:"";position:absolute;left:-6px;right:-6px;top:4px;bottom:2px;background:radial-gradient(ellipse at center,rgba(246,241,231,.75),rgba(246,241,231,.15) 70%,transparent);border-radius:40%}
.strike{text-decoration:line-through;text-decoration-color:rgba(69,70,77,.8);text-decoration-thickness:2px}
.heavy{color:#c3beb3;filter:blur(1.1px)}
/* printed manuscript leftover */
.print{position:relative;margin:4px 0 8px;padding:14px 14px 12px;background:#fffdf8;border:1px solid #e7dcc8;box-shadow:2px 3px 0 rgba(90,60,30,.08);transform:rotate(-.6deg)}
.print b{display:block;font-size:9px;letter-spacing:3px;color:#a08a6a;margin-bottom:10px;font-weight:400}
.print i{display:block;height:6px;background:#d8d0c2;margin:7px 0;border-radius:2px}
.tape{position:absolute;top:-9px;left:40%;width:58px;height:18px;background:rgba(233,220,190,.75);transform:rotate(3deg)}
.sketch{display:inline-block;vertical-align:middle;margin:0 4px}
.crumbs{position:absolute;right:40px;bottom:70px;width:60px;height:24px;background:radial-gradient(circle at 10% 50%,#e8e1d4 2px,transparent 3px),radial-gradient(circle at 40% 30%,#e3dccd 1.5px,transparent 2.5px),radial-gradient(circle at 70% 70%,#e8e1d4 2px,transparent 3px),radial-gradient(circle at 90% 40%,#ddd5c5 1.5px,transparent 2.5px)}
/* ui */
.bar{display:flex;align-items:center;gap:16px;font-family:"Nanum Pen Script";font-size:22px;color:#cbb79a}
.bar button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(203,183,154,.4);background:transparent;color:#cbb79a;font-size:18px;cursor:pointer}
.bar button:disabled{opacity:.25;cursor:default}
.cap{font-size:12px;letter-spacing:3px;color:#7d6d5a;font-family:"Nanum Myeongjo"}

.tie{position:absolute;inset:-8px;pointer-events:none;z-index:50}
.tie .sv{position:absolute;left:62%;top:0;bottom:0;width:4px;background:var(--thread);box-shadow:1px 0 2px rgba(0,0,0,.35);transition:transform 1.1s cubic-bezier(.5,0,.3,1) .35s,opacity .8s .6s}
.tie .sh{position:absolute;top:56%;left:0;right:0;height:4px;background:var(--thread);box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform 1.1s cubic-bezier(.5,0,.3,1) .35s,opacity .8s .6s}
.knot{position:absolute;left:62%;top:56%;width:0;height:0;transition:transform .6s ease,opacity .5s .5s}
.knot i{position:absolute;width:30px;height:18px;border:4px solid var(--thread);border-radius:50%;top:-9px}
.knot i:nth-child(1){left:-30px;transform:rotate(18deg)}
.knot i:nth-child(2){left:4px;transform:rotate(-18deg)}
.knot b{position:absolute;left:-4px;top:-5px;width:12px;height:12px;border-radius:4px;background:#6a251b}
.knot em{position:absolute;top:4px;width:4px;height:30px;background:var(--thread);border-radius:2px}
.knot em:nth-of-type(1){left:-6px;transform:rotate(22deg);transform-origin:top}
.knot em:nth-of-type(2){left:6px;transform:rotate(-14deg);transform-origin:top}
.tie.loose .knot{transform:rotate(-40deg) scale(.6);opacity:0}
.tie.loose .sv{transform:translateY(110%) rotate(8deg);opacity:0}
.tie.loose .sh{transform:translateX(115%) rotate(-6deg);opacity:0}
.tie.tug .sv,.tie.tug .sh,.tie.tug .knot{animation:tug .4s}
@keyframes tug{30%{translate:0 -2px}60%{translate:0 2px}}
.lock{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,380px)}
.lk-hint{font-family:"Nanum Pen Script";font-size:21px;color:#cbb79a}
.lk-row{display:flex;gap:8px;width:100%}
.lk-row input{flex:1;min-width:0;height:46px;background:#f6f1e7;border:0;border-bottom:2px solid var(--thread);padding:0 14px;font-size:20px;letter-spacing:10px;font-family:inherit;color:var(--pencil);outline:none;border-radius:2px}
.lk-row input::placeholder{letter-spacing:1px;font-size:14px;color:#a99a85}
.lk-row button{height:46px;padding:0 18px;border:0;background:var(--thread);color:#f6f1e7;font-family:"Nanum Pen Script";font-size:22px;border-radius:2px;cursor:pointer}
.lk-row button:disabled{opacity:.6}
.lk-err{min-height:22px;font-family:"Nanum Pen Script";font-size:20px;color:#d58a76}
.lock.gone{opacity:0;transform:translateY(8px);transition:.5s;pointer-events:none}
.bar[hidden]{display:none}
.mark{position:absolute;left:70px;top:214px;font-family:"Nanum Myeongjo";font-size:9.5px;letter-spacing:2px;color:#5a3d22;opacity:.75}
.credit{font-family:"Nanum Myeongjo";font-size:10px;letter-spacing:3px;color:#6e604f}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(DATA.s),iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.i)},key,b64(DATA.c)));}
const book=document.getElementById('book'),tie=document.getElementById('tie'),lock=document.getElementById('lock'),nav=document.getElementById('nav');
const pg=document.getElementById('pg'),prev=document.getElementById('prev'),next=document.getElementById('next');
let leaves=[],N=0,cur=0,open=false;
function label(){pg.textContent=cur===0?'표지':cur===N-1?'뒤표지':cur+' / '+(N-2);prev.disabled=cur===0;next.disabled=cur===N-1;}
function render(){leaves.forEach((l,i)=>{l.style.zIndex=i<cur?i:N-i;l.classList.toggle('turned',i<cur);});label();}
function go(d){if(!open)return;const t=cur+d;if(t<0||t>N-1)return;const l=leaves[d>0?cur:t];l.classList.add('turning');l.style.zIndex=N+1;setTimeout(()=>l.classList.remove('turning'),1000);cur=t;leaves.forEach((x,i)=>x.classList.toggle('turned',i<cur));label();setTimeout(render,1000);}
lock.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw'),ok=document.getElementById('ok'),err=document.getElementById('err');
 if(!/^\d{4}$/.test(pw.value)){err.textContent='숫자 네 자리.';return;}
 ok.disabled=true;ok.textContent='푸는 중';err.textContent='';
 try{const html=await unlock(pw.value);book.insertAdjacentHTML('beforeend',html);
  leaves=[...document.querySelectorAll('.leaf')];N=leaves.length;
  leaves.forEach(l=>l.addEventListener('click',()=>go(1)));render();
  document.querySelector('.cover .hint').textContent='눌러서 펼치기 ›';
  tie.classList.add('loose');lock.classList.add('gone');
  setTimeout(()=>{lock.remove();nav.hidden=false;open=true;render();},1500);
 }catch(_){err.textContent='매듭이 풀리지 않는다.';tie.classList.remove('tug');void tie.offsetWidth;tie.classList.add('tug');pw.value='';pw.focus();ok.disabled=false;ok.textContent='실 풀기';}
};
next.onclick=()=>go(1);prev.onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
let sx=null;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(dx<0?1:-1);sx=null},{passive:true});
leaves=[...document.querySelectorAll('.leaf')];N=leaves.length;
</script>
</body>
