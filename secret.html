<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNSAID · Sealed Files</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#f4f0e9;--paper2:#e9e4db;--ink:#292c2a;--sub:#73766e;--line:#d9d1c4;--red:#b5443b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper2);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;padding:28px 16px 48px}
.wrap{max-width:640px;margin:auto;background:var(--paper);border:1px solid var(--line)}
.serif{font-family:"Noto Serif KR","Nanum Myeongjo","Apple Myungjo",serif}
.mast{padding:22px 22px 20px;border-bottom:1px solid var(--ink)}
.kick{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2.5px;color:var(--sub);border-top:2px solid var(--ink);padding-top:9px}
.mast h1{font-size:40px;line-height:1.15;letter-spacing:-1.5px;margin-top:16px}
.mast p{font-size:15px;line-height:1.7;color:#555b54;margin-top:12px}
.warn{margin-top:14px;font-size:12.5px;color:var(--red);display:flex;gap:8px;align-items:baseline}
.warn b{font-size:9.5px;letter-spacing:1.5px;border:1px solid var(--red);padding:1px 5px}
.file{border-top:1px solid var(--line)}
.file:first-of-type{border-top:0}
.fhead{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 22px;color:#fff}
.fhead .no{font-size:10px;letter-spacing:2.5px;opacity:.75}
.fhead .nm{font-size:26px;font-weight:700;margin-top:3px}
.fhead .rl{font-size:10px;letter-spacing:2px;opacity:.75;padding-bottom:5px}
.fbody{padding:22px}
.seal{display:flex;flex-direction:column;gap:14px}
.stamp{display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:2.5px;color:var(--sub)}
.stamp::after{content:"";flex:1;height:1px;background:var(--line)}
.lines{display:flex;flex-direction:column;gap:9px}
.lines i{display:block;height:9px;background:#e2dbd0;border-radius:2px}
.hint{font-size:13px;color:#555b54}
.hint span{font-size:9.5px;letter-spacing:2px;color:var(--sub);margin-right:8px}
.form{display:flex;gap:8px}
.form input{flex:1;min-width:0;height:46px;border:1px solid var(--ink);background:#fbf9f5;padding:0 14px;font-size:18px;letter-spacing:8px;font-family:inherit;color:var(--ink);outline:none;border-radius:0}
.form input::placeholder{letter-spacing:1px;font-size:13px;color:#a39686}
.form input:focus{background:#fff}
.form button{flex:none;height:46px;padding:0 20px;border:0;color:#fff;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;font-family:inherit;border-radius:0}
.form button:disabled{opacity:.6;cursor:wait}
.err{font-size:12.5px;color:var(--red);min-height:18px}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.open{animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ttl{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:14px}
ol{list-style:none;counter-reset:n}
ol li{counter-increment:n;display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.65}
ol li::before{content:counter(n,decimal-leading-zero);flex:none;width:22px;font-size:11px;letter-spacing:1px;color:var(--sub);padding-top:4px}
.fn{margin-top:14px;padding:12px 14px;font-size:13.5px;line-height:1.6;color:#3a3f3b}
.foot{display:flex;height:4px}
.foot i{flex:1}
.colo{padding:16px 22px;border-top:1px solid var(--ink);font-size:11px;color:var(--sub);line-height:1.6}
@media(max-width:420px){.mast h1{font-size:34px}.fbody,.mast{padding-left:18px;padding-right:18px}.fhead{padding:14px 18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="kick"><span>UNSAID — SEALED FILES</span><span>CONFIDENTIAL</span></div>
    <h1 class="serif">말하지 않은<br>것들의 기록.</h1>
    <p>두 사람이 끝내 꺼내지 않은 이야기가 여기에 봉인되어 있습니다. 날짜 하나를 알면 열 수 있습니다.</p>
    <div class="warn"><b>SPOILER</b>비밀 설정이 그대로 담겨 있습니다. 플레이 중이라면 직접 알아낸 뒤에 여는 것을 권합니다.</div>
  </header>
  <main id="files"></main>
  <div class="colo">비밀번호는 숫자 4자리이며, 두 사람의 다른 페이지 어딘가에 남아 있습니다.<br>© 남주수용소 소장 · 무단 복제·사용 금지</div>
  <div class="foot"><i style="background:#293942"></i><i style="background:#e9e4db"></i><i style="background:#6c5848"></i></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(enc, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(enc.s), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const out = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.i)}, key, b64(enc.c));
  return new TextDecoder().decode(out);
}

const files = document.getElementById("files");
DATA.forEach(f => {
  const el = document.createElement("section");
  el.className = "file";
  el.innerHTML = `
    <div class="fhead" style="background:${f.color}"><div><div class="no">${f.no}</div><div class="nm serif">${f.name}</div></div><div class="rl">${f.role}</div></div>
    <div class="fbody">
      <div class="seal">
        <div class="stamp">SEALED · ${f.n} ENTRIES</div>
        <div class="lines"><i style="width:92%"></i><i style="width:78%"></i><i style="width:86%"></i><i style="width:64%"></i></div>
        <div class="hint"><span>HINT</span>${f.hint}</div>
        <form class="form" autocomplete="off">
          <input type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리" aria-label="${f.name} 파일 비밀번호">
          <button type="submit" style="background:${f.color}">열기</button>
        </form>
        <div class="err" aria-live="polite"></div>
      </div>
    </div>`;
  files.appendChild(el);
  const form = el.querySelector("form"), input = el.querySelector("input"), btn = el.querySelector("button"), err = el.querySelector(".err");
  form.onsubmit = async e => {
    e.preventDefault();
    const pw = input.value.trim();
    if(!/^\d{4}$/.test(pw)){ err.textContent = "숫자 4자리를 입력해 주세요."; return; }
    btn.disabled = true; btn.textContent = "확인 중"; err.textContent = "";
    try{
      const html = await unlock(f.enc, pw);
      const body = el.querySelector(".fbody");
      body.innerHTML = `<div class="open">${html}</div>`;
      const fn = body.querySelector(".fn"); if(fn){ fn.style.background = f.soft; fn.style.borderLeft = "3px solid " + f.color; }
    }catch(_){
      err.textContent = "열리지 않습니다. 다른 날짜일지도 모릅니다.";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      input.value = ""; input.focus();
      btn.disabled = false; btn.textContent = "열기";
    }
  };
});
</script>
