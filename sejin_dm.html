<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세진 · 채팅</title>
<style>
:root{
  --bg:#e9ecef; --yellow:#fee500; --room:#abc1d1; --ink:#191919; --sub:#8a8f95; --line:#eceff1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
.phone{position:relative;width:min(100vw,420px);height:min(100dvh,860px);background:#fff;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:460px){.phone{border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.18)}}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.hidden{display:none!important}

/* 목록 */
.l-head{display:flex;justify-content:space-between;align-items:center;padding:20px 18px 8px}
.l-head h1{font-size:22px;font-weight:700}
.l-head .ic{display:flex;gap:16px;color:#333;font-size:18px}
.list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;padding:11px 18px;cursor:pointer}
.row:active{background:#f3f5f6}
.av{position:relative;overflow:hidden;flex:none;width:48px;height:48px;border-radius:38%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.av img,.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.sm{width:36px;height:36px;font-size:14px}
.r-mid{flex:1;min-width:0}
.r-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-prev{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:11px;color:var(--sub)}
.badge{background:#ff4d3d;color:#fff;border-radius:10px;min-width:19px;height:19px;padding:0 5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.tabbar{display:flex;border-top:1px solid var(--line);padding:8px 0 12px;background:#fff}
.tabbar div{flex:1;text-align:center;font-size:11px;color:#9aa0a6}
.tabbar div b{display:block;font-size:19px;margin-bottom:2px;font-weight:400}
.tabbar .on{color:#191919}

/* 채팅방 */
.room{background:var(--room)}
.c-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;background:var(--room)}
.c-head .back{font-size:22px;cursor:pointer;padding:0 6px}
.c-head .nm{flex:1;font-size:17px;font-weight:700}
.c-head .ic{display:flex;gap:16px;font-size:17px}
.body{flex:1;overflow-y:auto;padding:6px 12px 14px}
.div{display:flex;justify-content:center;margin:14px 0 10px}
.div span{background:rgba(0,0,0,.18);color:#fff;font-size:11px;padding:4px 12px;border-radius:12px}
.grp{display:flex;margin-top:6px}
.grp.me{justify-content:flex-end}
.col{display:flex;flex-direction:column;gap:4px;max-width:72%}
.grp.me .col{align-items:flex-end}
.who{font-size:12px;color:#3b4a56;margin:0 0 2px 2px}
.line{display:flex;align-items:flex-end;gap:5px}
.grp.me .line{flex-direction:row-reverse}
.bub{padding:8px 11px;border-radius:14px;font-size:14.5px;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere;white-space:pre-wrap}
.them .bub{background:#fff;border-top-left-radius:4px}
.me .bub{background:var(--yellow);border-top-right-radius:4px}
.meta{display:flex;flex-direction:column;align-items:flex-start;font-size:10.5px;color:#4d5d69;line-height:1.2}
.grp.me .meta{align-items:flex-end}
.meta .rd{color:#d49a00;font-weight:700}
.avwrap{width:36px;margin-right:8px;flex:none}
.typing{display:flex;margin-top:8px}
.typing .bub{display:flex;gap:4px;padding:11px 13px;border-top-left-radius:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9ba3aa;display:block;animation:bn 1.1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

.input{display:flex;align-items:center;gap:8px;padding:8px 10px 14px;background:#fff}
.input .plus{flex:none;width:34px;height:34px;border-radius:50%;background:#f1f3f5;display:flex;align-items:center;justify-content:center;font-size:22px;color:#555}
.fake{flex:1;min-height:38px;background:#f3f4f6;border-radius:19px;padding:9px 14px;font-size:14.5px;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.fake .cur{display:inline-block;width:1.5px;height:17px;background:#333;margin-left:1px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.send{flex:none;width:34px;height:34px;border-radius:50%;background:#e9ecef;color:#aaa;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.15s}
.send.on{background:var(--yellow);color:#191919}

/* 친구 탭 */
.sec{padding:10px 18px 4px;font-size:12px;color:var(--sub)}
.row.me-p{padding:12px 18px}
.row.me-p .av{width:56px;height:56px;font-size:20px}
.row.me-p .r-name{font-size:16px}
.stat{font-size:12.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{height:1px;background:var(--line);margin:6px 18px}
.dotnew{width:7px;height:7px;border-radius:50%;background:#ff4d3d;display:inline-block;margin-left:5px;vertical-align:middle}
.sheet{position:absolute;inset:0;background:linear-gradient(#6b7f93,#3e4c5a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 24px 40px;z-index:5}
.sheet .x{position:absolute;top:18px;left:20px;font-size:22px;cursor:pointer}
.sheet .big{position:relative;overflow:hidden;width:104px;height:104px;border-radius:38%;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;margin-bottom:16px}
.sheet h2{font-size:21px;font-weight:700}
.sheet p{margin:8px 0 22px;font-size:14px;opacity:.9;text-align:center;line-height:1.5}
.sheet .btns{display:flex;gap:28px;border-top:1px solid rgba(255,255,255,.2);padding-top:18px;width:100%;justify-content:center}
.sheet .btns div{text-align:center;font-size:12px;cursor:pointer}
.sheet .btns b{display:block;font-size:22px;margin-bottom:5px;font-weight:400}
.sheet .btns .off{opacity:.35;cursor:default}
</style>
</head>
<body>
<div class="phone">
  <section class="view" id="listView">
    <div class="l-head"><h1 id="lTitle">채팅</h1><div class="ic"><span>⌕</span><span>＋</span></div></div>
    <div class="list" id="list"></div>
    <div class="list hidden" id="friends"></div>
    <div class="tabbar"><div id="tabF"><b>☺</b>친구</div><div id="tabC" class="on"><b>💬</b>채팅</div><div><b>◎</b>오픈채팅</div><div><b>▤</b>더보기</div></div>
    <div class="sheet hidden" id="sheet"></div>
  </section>

  <section class="view room hidden" id="roomView">
    <div class="c-head"><span class="back" id="back">‹</span><span class="nm" id="roomName"></span><span class="ic"><span>⌕</span><span>☰</span></span></div>
    <div class="body" id="body"></div>
    <div class="input"><div class="plus">＋</div><div class="fake" id="fake"></div><div class="send" id="send">↑</div></div>
  </section>
</div>

<script>
/* ===== 여기만 고치세요 ===== */
const USER = "{{user}}";            // 플랫폼은 이 페이지를 치환하지 못하므로 원하는 이름으로 바꿔 쓰세요
const ME   = "배세진";

const CHATS = [
 { id:"user", name:"{u}", color:"#8fa6c4", init:"♡", time:"오후 11:52", badge:0, finale:true,
   msgs:[
    {d:"저녁"},
    {w:"them",t:"배세진 오늘 뭐해",tm:"오후 9:40"},
    {w:"me",t:"작업 중. 왜",tm:"오후 9:41"},
    {w:"them",t:"그냥 심심해서",tm:"오후 9:41"},
    {w:"me",t:"심심하면 와. 커피 내려줄게",tm:"오후 9:42"},
    {w:"them",t:"ㅋㅋ 알았어 내일 갈게",tm:"오후 9:43"},
    {w:"me",t:"그래. 밥은 먹고 다니냐",tm:"오후 9:43"},
    {w:"them",t:"너는ㅋㅋ",tm:"오후 9:44"},
    {w:"me",t:"나는 안 먹었지",tm:"오후 9:44"},
    {w:"them",t:"야 ㅋㅋ",tm:"오후 9:45"},
    {d:"늦은 밤"},
    {w:"me",t:"행복하냐?",tm:"오후 11:40"},
    {w:"them",t:"갑자기?ㅋㅋ 왜",tm:"오후 11:44"},
    {w:"me",t:"그냥. 가끔 궁금해서",tm:"오후 11:45"},
    {w:"them",t:"나 잘 지내ㅋㅋ",tm:"오후 11:48"},
    {w:"me",t:"…그래. 다행이다",tm:"오후 11:49"}
   ]},
 { id:"taeo", name:"김태오", color:"#c4a58f", init:"태", time:"오후 9:30", badge:0, typingEnd:true,
   msgs:[
    {w:"them",t:"소개팅 어땠냐",tm:"오후 9:20"},
    {w:"me",t:"그냥 그랬어",tm:"오후 9:22"},
    {w:"them",t:"또? 이번엔 뭐가 문젠데",tm:"오후 9:23"},
    {w:"me",t:"…비교하게 되더라",tm:"오후 9:25"},
    {w:"them",t:"누구랑",tm:"오후 9:25"},
    {w:"me",t:"몰라. 그냥",tm:"오후 9:27"},
    {w:"them",t:"야 설마 아직도 그 사람이냐",tm:"오후 9:28"},
    {w:"me",t:"아니라고\n자라",tm:"오후 9:30"}
   ]},
 { id:"boss", name:"하 대표님", color:"#8fb5a3", init:"하", time:"오전 9:12", badge:0,
   msgs:[
    {w:"them",t:"세진 씨, 그 건 말인데. 거기서 회신 날짜 알려 달라던데",tm:"오전 9:02"},
    {w:"me",t:"아 네… 아직 고민 중입니다",tm:"오전 9:05"},
    {w:"them",t:"서울 밖이라 쉽진 않겠지만, 급하게 결정하지는 마요. 어느 쪽이든 응원해요",tm:"오전 9:08"},
    {w:"me",t:"감사합니다. 정리되면 말씀드리겠습니다",tm:"오전 9:12"}
   ]},
 { id:"mom", name:"엄마", color:"#d6a3b5", init:"엄", time:"어제", badge:2,
   msgs:[
    {w:"them",t:"아들 밥은 챙겨 먹고 다니니?",tm:"오후 6:10"},
    {w:"me",t:"먹었어요. 걱정 마세요",tm:"오후 6:30"},
    {w:"them",t:"주말에 집에 올 거지?",tm:"오후 6:41"},
    {w:"them",t:"반찬 해 놓을게",tm:"오후 6:41"}
   ]},
 { id:"self", name:"나와의 채팅", color:"#b7b2d6", init:"나", time:"월요일", badge:0,
   msgs:[
    {d:"월요일"},
    {w:"me",t:"목요일 현장 10시\n도면 수정\n시더우드 오일 주문",tm:"오전 8:12"},
    {w:"me",t:"연락 오면 바로 답하지 말 것",tm:"오후 11:03"}
   ]}
];
/* ========================== */

/* 프로필 사진 (id별). 불러오지 못하면 글자 아이콘이 대신 보입니다 */
const IMG = {
  __me:"https://i.ibb.co/4gC9nn3M/1.png",
  user:"https://i.ibb.co/S7Dmkdmx/from-Pix-AI-2079805783028504878-3.png",
  taeo:"https://i.ibb.co/8DzYf7Qr/from-Pix-AI-2065660972435418032.png",
  boss:"https://i.ibb.co/JFGqpjzp/from-Pix-AI-2065284631006287386-2.png",
  jian:"https://i.ibb.co/3mZH7nfN/2.png",
  site:"https://i.ibb.co/8DwpSFmf/from-Pix-AI-2066385349525336535.png"
};
const pic = o => IMG[o.id] ? `<img src="${IMG[o.id]}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : "";
const $ = s => document.querySelector(s);
const T = s => s.replaceAll("{u}", USER);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let token = 0;

function previewOf(c){ const m=[...c.msgs].reverse().find(x=>x.t); return m ? T(m.t).replace(/\n/g," ") : ""; }

/* 친구 탭 데이터 — 상태메시지에 단서를 넣을 수 있습니다 */
const MYPROFILE = { id:"__me", name:ME, color:"#6f8f7f", init:"세", status:"마감 전이라 좀비 상태" };
const FRIENDS = [
  { id:"user", fav:true, name:"{u}", color:"#8fa6c4", init:"♡", status:"오늘도 출근 완료", fresh:true },
  { id:"taeo", name:"김태오", color:"#c4a58f", init:"태", status:"운동 가야 하는데…" },
  { id:"boss", name:"하 대표님", color:"#8fb5a3", init:"하", status:"스튜디오 휴무 공지 확인 바랍니다" },
  { id:"jian", name:"박지안", color:"#9db0d6", init:"지", status:"야근 중. 위로는 커피로" },
  { id:"site", name:"최 소장님", color:"#b9a98f", init:"최", status:"비 오면 현장 쉽니다" },
  { id:"mom",  name:"엄마", color:"#d6a3b5", init:"엄", status:"건강이 최고" }
];

function renderFriends(){
  const fr = FRIENDS.filter(f=>!f.fav), fv = FRIENDS.filter(f=>f.fav);
  const row = f => `<div class="row" data-f="${f.id}"><div class="av" style="background:${f.color}">${pic(f)}${f.init}</div><div class="r-mid"><div class="r-name">${T(f.name)}${f.fresh?'<i class="dotnew"></i>':''}</div><div class="stat">${T(f.status)}</div></div></div>`;
  $("#friends").innerHTML =
    `<div class="row me-p" data-f="__me"><div class="av" style="background:${MYPROFILE.color}">${pic(MYPROFILE)}${MYPROFILE.init}</div><div class="r-mid"><div class="r-name">${MYPROFILE.name}</div><div class="stat">${MYPROFILE.status}</div></div></div>
     <div class="hr"></div><div class="sec">즐겨찾기 ${fv.length}</div>${fv.map(row).join("")}
     <div class="sec">친구 ${fr.length}</div>${fr.map(row).join("")}`;
  document.querySelectorAll("#friends .row").forEach(r => r.onclick = () => openSheet(r.dataset.f));
}

function openSheet(id){
  const f = id==="__me" ? MYPROFILE : FRIENDS.find(x=>x.id===id);
  const canChat = id!=="__me" && CHATS.some(c=>c.id===id);
  const sh = $("#sheet");
  sh.innerHTML = `<span class="x" id="sx">✕</span><div class="big" style="background:${f.color}">${pic(f)}${f.init}</div><h2>${T(f.name)}</h2><p>${T(f.status)}</p>
    <div class="btns"><div class="${canChat?'':'off'}" id="sc"><b>💬</b>1:1 채팅</div><div class="off"><b>📞</b>통화</div></div>`;
  sh.classList.remove("hidden");
  $("#sx").onclick = () => sh.classList.add("hidden");
  if(canChat) $("#sc").onclick = () => { sh.classList.add("hidden"); showTab("c"); openRoom(id); };
}

function showTab(w){
  const f = w==="f";
  $("#friends").classList.toggle("hidden", !f); $("#list").classList.toggle("hidden", f);
  $("#tabF").classList.toggle("on", f); $("#tabC").classList.toggle("on", !f);
  $("#lTitle").textContent = f ? "친구" : "채팅";
}
$("#tabF").onclick = () => showTab("f");
$("#tabC").onclick = () => showTab("c");

function renderList(){
  $("#list").innerHTML = CHATS.map(c => `
    <div class="row" data-id="${c.id}">
      <div class="av" style="background:${c.color}">${pic(c)}${c.init}</div>
      <div class="r-mid"><div class="r-name">${T(c.name)}</div><div class="r-prev">${previewOf(c)}</div></div>
      <div class="r-end"><span>${c.time}</span>${c.badge?`<span class="badge">${c.badge}</span>`:""}</div>
    </div>`).join("");
  document.querySelectorAll(".row").forEach(r => r.onclick = () => openRoom(r.dataset.id));
}

function esc(s){ return s.replace(/[&<>]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }

function bubbleHTML(c, group){
  const me = group.w === "me";
  const lines = group.items.map((m,i)=>{
    const last = i === group.items.length-1;
    const meta = last ? `<div class="meta">${m.rd?`<span class="rd">1</span>`:""}<span>${m.tm||""}</span></div>` : "";
    return `<div class="line"><div class="bub">${esc(T(m.t))}</div>${meta}</div>`;
  }).join("");
  const av = me ? "" : `<div class="avwrap"><div class="av sm" style="background:${c.color}">${pic(c)}${c.init}</div></div>`;
  const who = (!me && c.id!=="self") ? `<div class="who">${T(c.name)}</div>` : "";
  return `<div class="grp ${me?"me":"them"}">${av}<div class="col">${who}${lines}</div></div>`;
}

function renderMsgs(c, upto){
  const body = $("#body"); body.innerHTML = "";
  let cur = null, html = "";
  const flush = () => { if(cur){ html += bubbleHTML(c, cur); cur = null; } };
  (upto ?? c.msgs).forEach(m => {
    if(m.d){ flush(); html += `<div class="div"><span>${m.d}</span></div>`; return; }
    if(!cur || cur.w !== m.w){ flush(); cur = {w:m.w, items:[]}; }
    cur.items.push(m);
  });
  flush(); body.innerHTML = html;
  body.scrollTop = body.scrollHeight;
}

function typingEl(c){
  const d = document.createElement("div");
  d.className = "typing pop";
  d.innerHTML = `<div class="avwrap"><div class="av sm" style="background:${c.color}">${pic(c)}${c.init}</div></div><div class="bub"><i></i><i></i><i></i></div>`;
  return d;
}

function setInput(txt){
  $("#fake").innerHTML = esc(txt) + `<span class="cur"></span>`;
  $("#send").classList.toggle("on", txt.length > 0);
}

function openRoom(id){
  const c = CHATS.find(x => x.id === id); const my = ++token;
  $("#roomName").textContent = T(c.name);
  $("#listView").classList.add("hidden"); $("#roomView").classList.remove("hidden");
  renderMsgs(c); setInput("");
  if(c.typingEnd){ const t = typingEl(c); t.dataset.keep="1"; $("#body").appendChild(t); $("#body").scrollTop = 1e6; }
  if(c.finale) finale(c, my);
}

$("#back").onclick = () => { token++; $("#roomView").classList.add("hidden"); $("#listView").classList.remove("hidden"); };

async function finale(c, my){
  const ok = () => my === token;
  const body = $("#body");
  await sleep(1400); if(!ok()) return;
  const dots = typingEl(c); body.appendChild(dots); body.scrollTop = body.scrollHeight;     // 상대가 입력 중...
  await sleep(1600); if(!ok()) return;
  const draft = T("{u}야, 나 사실");
  let s = "";
  for(const ch of draft){ s += ch; setInput(s); await sleep(95); if(!ok()) return; }       // 세진이 쓰던 말
  await sleep(900); if(!ok()) return;
  dots.remove();                                                                          // 상대 입력 멈춤
  await sleep(1100); if(!ok()) return;
  while(s.length){ s = s.slice(0,-1); setInput(s); await sleep(60); if(!ok()) return; }    // 지운다
  await sleep(800); if(!ok()) return;
  const send = "잘 자. 내일 봐";
  for(const ch of send){ s += ch; setInput(s); await sleep(110); if(!ok()) return; }
  await sleep(700); if(!ok()) return;
  setInput("");
  const msg = {w:"me", t:send, tm:"오후 11:52", rd:true};
  body.insertAdjacentHTML("beforeend", bubbleHTML(c, {w:"me", items:[msg]}));
  body.lastElementChild.classList.add("pop"); body.scrollTop = body.scrollHeight;
}
